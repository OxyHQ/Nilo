name: Deploy Nilo API to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-nilo-api
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: nilo
  CLUSTER: oxy-cluster

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # New Oxy repositories use GitHub's ID-qualified subject. Printing only
      # that claim gives infra the exact trust-policy value without exposing
      # the signed token itself.
      - name: Report OIDC subject
        shell: bash
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          case $((${#payload} % 4)) in 2) payload="${payload}==";; 3) payload="${payload}=";; esac
          printf 'OIDC subject: %s\n' "$(printf '%s' "$payload" | base64 -d | jq -r .sub)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps; without them buildx skips the cache silently. Only a push to main
      # or a dispatch runs this workflow, so pull-request code never writes this
      # cache scope.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      # Same Dockerfile, context, platform and tags as the plain `docker build`
      # this replaces, pushed in the same step. --provenance=false keeps the
      # pushed artefact a single-platform image manifest, as before, rather
      # than an index with an attestation.
      - name: Build and push immutable ARM64 image
        id: image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-api \
            --cache-to type=gha,scope=$APP-api,mode=max \
            --provenance=false \
            -f apps/api/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            --push \
            .
          digest=$(aws ecr describe-images --repository-name "oxy/$APP" \
            --image-ids imageTag="${{ github.sha }}" --query 'imageDetails[0].imageDigest' --output text)
          echo "uri=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Migrate and deploy to ECS
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: bash .github/scripts/deploy-ecs.sh
