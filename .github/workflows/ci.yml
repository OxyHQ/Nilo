name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # bump-base-digests.yml opens its PR with GITHUB_TOKEN, which triggers no
  # pull_request run, so it dispatches this workflow on the bump branch. A
  # dispatched run is not a pull_request, so `changes` reports every area and
  # every job below runs, the image build and smoke included.
  workflow_dispatch:

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main gets a group of its own through the run id, since a shared group would
# still let a newer pending run replace an older pending one even with
# cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which app a pull request touches, so an app-only change does not pay for
  # the API build and the arm64 image, and an API-only change does not pay for
  # the Expo web export. `Lint & Test` is not filtered: its boundary suites
  # read apps/app, the workflows and the manifests. Anything outside the two
  # app directories (bun.lock, any package.json, scripts, this workflow) counts
  # as both. Pushes to main always run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            api:
              - 'apps/api/**'
            app:
              - 'apps/app/**'
            manifests:
              - '**/package.json'
            shared:
              - '**'
              - '!apps/api/**'
              - '!apps/app/**'
              - '!docs/**'
              - '!**/*.md'

  # The Seldon race (OxyHQ/oxy docs/engineering/build-and-deploy.md, CI on
  # Seldon), opt-in with the repository variable CI_SELDON_RACE=true, on
  # same-repository pull requests only (this workflow has no merge_group
  # trigger; push and dispatched runs stay hosted, and deploy-aws.yml trusts
  # only a push run that concluded `success`). Unset, every job runs hosted as
  # before and none of these takes a runner. Set, Lint & Test and Build Web run
  # on the self-hosted seldon-ci pool; a lane still queued 3 minutes after it
  # was created gets its hosted twin (the `-hosted` jobs), the lane that starts
  # first wins and the finish job cancels the other through its job-level
  # concurrency group. A Seldon lane that fails, whatever the reason (the
  # house network drops new connections in bursts), reruns hosted in its
  # `-rescue` job, which fails again on a genuine failure. CI complete takes
  # the raced jobs' verdict from the race.
  #
  # Two waves, each with its own start and finish (the `names` input): Build
  # Web needs Lint & Test, so its lane exists only once the first wave's have
  # finished.
  race:
    if: ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read
    with:
      names: |
        Lint & Test

  race-finish:
    needs: race
    # `!cancelled()`: an ancestor skipped on this event must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read
    with:
      names: |
        Lint & Test

  race-2:
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue]
    if: ${{ !cancelled() && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') && needs.changes.outputs.app == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read
    with:
      names: |
        Build Web

  race-2-finish:
    needs: race-2
    # `!cancelled()`: an ancestor skipped on this event must not skip it.
    if: ${{ !cancelled() && needs.race-2.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read
    with:
      names: |
        Build Web

  lint-and-test:
    name: Lint & Test
    runs-on: &seldon-lane ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && 'seldon-ci' || 'ubuntu-latest' }}
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Lint & Test
    permissions: &race-lane-permissions
      contents: read
      actions: read # the Seldon race guard reads this run's jobs
    timeout-minutes: 15
    services: &lint-and-test-services
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nilo
          POSTGRES_PASSWORD: nilo
          POSTGRES_DB: postgres
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U nilo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps: &lint-and-test-steps
      # A lane that starts after its hosted twin waits here to be cancelled (the Seldon race).
      - &race-guard
        name: Seldon race guard
        if: vars.CI_SELDON_RACE == 'true' && !endsWith(github.job, '-rescue')
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: guard
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails on a second copy of a package the Oxy packages share (zod among
      # them) or a native peer of the installed services the app does not declare.
      - name: Oxy dependency health (oxy-doctor)
        run: bun run doctor:oxy

      - name: Verify Android device session module autolinking
        run: |
          node -e '
            const { createRequire } = require("node:module");
            const { resolve } = require("node:path");
            const fromApp = createRequire(resolve("apps/app/package.json"));
            const expected = fromApp("./package.json").dependencies?.["@oxy.so/services"];
            const installed = fromApp("@oxy.so/services/package.json").version;
            if (typeof expected !== "string" || expected !== installed) {
              console.error("Installed Oxy Services does not match the app declaration");
              process.exit(1);
            }
          '
          bun run oxy-doctor-expo-android --project-root=apps/app \
            --require-source=SharedDeviceSessionPublish.kt \
            --require-source=SharedDeviceSessionSweep.kt \
            --require-source=OxyDeviceSessionStore.kt

      - name: Lint (Biome)
        run: bunx biome ci .

      # Translation keys follow ADR 0055: nested identifier segments under a
      # namespace, every locale shaped like English. Missing translations warn.
      - name: Translation keys (ADR 0055)
        run: bun run i18n:check

      # Every workspace typechecks; neither the API's bun build nor the Expo
      # export runs tsc, so without these a type error ships silently.
      - name: Typecheck the API
        run: bun run --filter @nilo/api typecheck
      - name: Typecheck the app
        run: bun run --filter @nilo/app typecheck
      - name: Typecheck the published contracts
        run: bun run --filter @oxy.so/nilo-contracts typecheck
      - name: Typecheck the Nilo SDK
        run: bun run --filter @oxy.so/nilo typecheck

      # Every Oxy app shares one Postgres: a new migration may not hold a lock
      # that stalls a hot table (NOT VALID foreign keys validated later, hot-table
      # DDL alone in its migration). The rules are @oxy.so/db's; the baseline and
      # hot tables are in apps/api's db:check-locks script.
      - name: Verify every new migration keeps its locks short
        run: bun run --filter @nilo/api db:check-locks

      # `packageManager` is the one bun pin. Every setup-bun here reads it, but
      # apps/api/Dockerfile's `FROM oven/bun:<ver>` is a literal; this fails
      # when the image (or a workflow) runs a different bun from the one that
      # wrote bun.lock.
      - name: Check the bun pin
        run: bun run check:bun-pin

      # Every `test*`/`check*` script in any package.json is run by this
      # workflow, and every test file outside the API's vitest tree is named by
      # one — `test:worker` once passed for months with no workflow running it.
      - name: Check every test and check script is run by CI
        run: bun run check:ci-wiring

      # The Cloudflare Worker that serves the web app (apps/app/worker, the
      # `main` of apps/app/wrangler.toml). Its tests are bun tests outside
      # either app's suite, so no other step runs them.
      - name: Run web worker tests
        run: bun run test:worker

      - name: Run API tests
        run: bun run --filter @nilo/api test

      # Production runs the API on Bun (apps/api/Dockerfile), so the same unit
      # suite also runs under Bun's runtime and test runner, not only under
      # vitest on Node. The *.pgdb suite stays on vitest: several of its files
      # rely on vitest-only APIs (vi.hoisted, `.rejects.toSatisfy`, thenables
      # under `.resolves`); the image smoke below covers Postgres under Bun.
      - name: Run API tests under Bun
        run: bun run --filter @nilo/api test:bun

      - name: Run API tests against PostgreSQL
        env:
          NILO_TEST_DATABASE_URL: postgres://nilo:nilo@127.0.0.1:5439/postgres
        run: bun run --filter @nilo/api test:pgdb

      # Builds the API and EXECUTES the built artefact under bun — the
      # image's runtime and command — with boot forced to fail, asserting a
      # non-zero exit, plus a real boot and clean shutdown as the control. An
      # uncaught exception at boot once exited 0, which reads as success.
      - name: The built API exits non-zero when boot fails
        env:
          NILO_TEST_DATABASE_URL: postgres://nilo:nilo@127.0.0.1:5439/postgres
        run: bun run check:api-entrypoints

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding
      # main undeployable. The fixture tests run first so a green check means
      # the gate can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Prove the base-image digest bump rewrites and re-pins
        run: python3 -B -m unittest discover -s .github/scripts -p test_bump_base_digests.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

      - name: Run app tests
        run: bun run --filter @nilo/app test

      # `@oxy.so/nilo`, the client other Oxy apps call Nilo with. Its unit
      # tests run here; e2e/calendar-sdk.test.ts runs it against the real API.
      - name: Run SDK tests
        run: bun run --filter @oxy.so/nilo test

      - name: Run end-to-end editing tests against PostgreSQL
        env:
          NILO_TEST_DATABASE_URL: postgres://nilo:nilo@127.0.0.1:5439/postgres
        run: bun run test:e2e

  # lint-and-test's hosted twin in the Seldon race: the same name, services and steps.
  lint-and-test-hosted:
    name: Lint & Test
    needs: race
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Lint & Test
    permissions: *race-lane-permissions
    services: *lint-and-test-services
    steps: *lint-and-test-steps

  # lint-and-test's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  lint-and-test-rescue:
    name: Lint & Test
    needs: lint-and-test
    if: ${{ !cancelled() && needs.lint-and-test.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: *race-lane-permissions
    services: *lint-and-test-services
    steps: *lint-and-test-steps

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue]
    # `!cancelled()` plus an explicit success check on Lint & Test, in
    # whichever lane passed it, replaces the implicit success(): a race loser
    # is cancelled and the twin or rescue skipped.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') && needs.changes.outputs.api == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: bun run build:api

  build-production-image:
    name: Build Production Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') && needs.changes.outputs.api == 'true' }}
    # A throwaway database for the image smoke below; nothing else uses it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nilo
          POSTGRES_PASSWORD: nilo
          POSTGRES_DB: nilo
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U nilo -d nilo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The same recipe the deploy builds, from the same guard: the Dockerfile
      # and context are its outputs, so this smoke tests what production would
      # build and fails like the deploy would on unreviewed inputs.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe nilo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Reads the deploy's cache scope on every run. Only a push to main writes
      # it (mode=max, every stage): deploy-aws.yml runs after this CI succeeds
      # on main and builds the same recipe from this cache, so the release is
      # cache hits rather than a second arm64 build. A pull request or a
      # dispatched run (the base-digest bump branch) never writes, so no
      # unmerged code can plant layers a production build would reuse.
      # Loaded into the runner's Docker, never pushed.
      - name: Build ARM64 API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.reviewed.outputs.context }}
          file: ${{ steps.reviewed.outputs.dockerfile }}
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: nilo-api:ci
          cache-from: type=gha,scope=nilo-api
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'type=gha,scope=nilo-api,mode=max' || '' }}

      # The image's own CMD, unmodified, with no DATABASE_URL: boot must fail
      # and the container must exit non-zero. The log line proves it got as far
      # as boot — a container that cannot even load the bundle also exits
      # non-zero. 124 is `timeout` killing a container that never exited.
      - name: The image exits non-zero when boot fails
        run: |
          set +e
          output=$(timeout 60 docker run --rm nilo-api:ci 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output" | tail -n 20
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "::error::the image exited $code with boot forced to fail; it must exit non-zero"
            exit 1
          fi
          if ! grep -qF 'DATABASE_URL is required.' <<<"$output"; then
            echo "::error::the image exited $code without reaching boot (no 'DATABASE_URL is required.')"
            exit 1
          fi
          echo "The image's CMD exited $code on a failed boot."

      # The image as ECS runs it: Bun as PID 1, both migrator phases, a 200
      # from /health/ready and a graceful exit 0 on SIGTERM. Also what the
      # image must hold: root-owned code the app user cannot write (only
      # /app/uploads is writable), no curl/wget, no API devDependencies, and a
      # HEALTHCHECK that passes on the live API and fails with none.
      - name: Smoke the API image under its Bun runtime
        env:
          IMAGE: nilo-api:ci
          DATABASE_URL: postgres://nilo:nilo@127.0.0.1:5439/nilo
        run: bash .github/scripts/smoke-api-image.sh

  build-web:
    name: Build Web
    runs-on: *seldon-lane
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Build Web
    permissions: *race-lane-permissions
    timeout-minutes: 10
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') && needs.changes.outputs.app == 'true' }}

    steps: &build-web-steps
      - *race-guard
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The Expo SDK 58 CLI needs Node 22.13+ / 24.3+; the runner's default is older.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.test
        run: bun run build:app

  # build-web's hosted twin in the Seldon race: the same name and steps.
  build-web-hosted:
    name: Build Web
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue, race-2]
    if: ${{ needs.race-2.outputs.race == 'true' && !cancelled() && needs.changes.result == 'success' && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Build Web
    permissions: *race-lane-permissions
    steps: *build-web-steps

  # build-web's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  build-web-rescue:
    name: Build Web
    needs: [changes, lint-and-test, lint-and-test-hosted, lint-and-test-rescue, build-web]
    if: ${{ needs.build-web.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && !cancelled() && needs.changes.result == 'success' && (needs.lint-and-test.result == 'success' || needs.lint-and-test-hosted.result == 'success' || needs.lint-and-test-rescue.result == 'success') && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: *race-lane-permissions
    steps: *build-web-steps

  # The one check this workflow stands for, modelled on OxyHQ/Gemies' and
  # OxyHQ/Bloom's: green only when every job above passed or skipped for a
  # reason this workflow declares, so a cancelled or unexplained-skipped job
  # can never read as a pass. Required checks by job name cannot follow the
  # Seldon race (a twin and a rescue share their job's name, and a cancelled
  # loser is not a failure); this one can.
  #
  # The skips it allows, and nothing else:
  #   - On a pull request, Build API and Build Production Image skip when
  #     `changes` said the API is untouched, and Build Web when it said the
  #     app is.
  #   - The jobs that need Lint & Test skip when it did not pass; it fails
  #     here on its own line.
  #   - The race's jobs, twins and rescues skip whenever they are not needed.
  # When the race or the rescue ran, a raced job passes on the race's verdict:
  # its name passed in some lane and failed in no hosted lane.
  ci-complete:
    name: CI complete
    if: always()
    # Not race-finish nor race-2-finish: their reapers run on seldon-ci-light
    # and only follow the cancellation, so needing them would wait on Seldon.
    needs:
      - changes
      - race
      - race-2
      - lint-and-test
      - lint-and-test-hosted
      - lint-and-test-rescue
      - build-api
      - build-production-image
      - build-web
      - build-web-hosted
      - build-web-rescue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the Seldon race verdict reads this run's jobs
    steps:
      # Per job name: passed when one of its lanes succeeded and no hosted lane
      # failed. Whenever the race is on: a rescue can run without the race.
      - name: Seldon race verdict
        id: race
        if: vars.CI_SELDON_RACE == 'true'
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: verdict
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          RACE_VERDICT: ${{ steps.race.outputs.outcome }}
        run: |
          set -euo pipefail
          failures=()
          result() { jq -r --arg job "$1" '.[$job].result // "missing"' <<<"$RESULTS"; }
          said() { jq -r --arg out "$1" '.changes.outputs[$out] // ""' <<<"$RESULTS"; }

          # `changes` runs on every event (outside a pull request it reports
          # every area).
          changes="$(result changes)"
          [ "$changes" = success ] || failures+=("changes did not pass: $changes")

          # The race's own jobs: skipped when not needed, never failed.
          for job in race race-2; do
            r="$(result "$job")"
            case "$r" in
              success | skipped) ;;
              *) failures+=("$job did not pass: $r") ;;
            esac
          done

          # A raced family's result, in $family: the verdict when its wave
          # raced (and the job was not skipped) or its rescue ran; otherwise
          # the job's own, with its twin and rescue skipped. Not called in a
          # subshell, so its failures reach the list.
          family() {
            local job="$1" wave="$2" own twin rescue raced
            own="$(result "$job")"
            twin="$(result "$job-hosted")"
            rescue="$(result "$job-rescue")"
            raced="$(jq -r --arg w "$wave" '.[$w].outputs.race // ""' <<<"$RESULTS")"
            if [ "$rescue" != skipped ] || { [ "$raced" = true ] && ! { [ "$own" = skipped ] && [ "$twin" = skipped ]; }; }; then
              family="${RACE_VERDICT:-no verdict}"
              return
            fi
            [ "$twin" = skipped ] || failures+=("$job-hosted ran although the Seldon race did not: $twin")
            family="$own"
          }

          family lint-and-test race
          lint="$family"
          [ "$lint" = success ] || failures+=("lint-and-test did not pass: $lint")

          # job, its `changes` output, its result.
          check() {
            local job="$1" filter="$2" r="$3"
            [ "$r" = success ] && return
            if [ "$r" = skipped ]; then
              if [ "$lint" != success ]; then return; fi
              if [ "$changes" = success ] && [ "$(said "$filter")" != true ]; then return; fi
            fi
            failures+=("$job did not pass: $r")
          }
          check build-api api "$(result build-api)"
          check build-production-image api "$(result build-production-image)"
          family build-web race-2
          check build-web app "$family"

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::$failure"
            done
            exit 1
          fi
          echo 'Every job passed, or skipped for a reason this workflow declares.'
