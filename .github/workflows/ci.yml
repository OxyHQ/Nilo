name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # bump-base-digests.yml opens its PR with GITHUB_TOKEN, which triggers no
  # pull_request run, so it dispatches this workflow on the bump branch. A
  # dispatched run is not a pull_request, so `changes` reports every area and
  # every job below runs, the image build and smoke included.
  workflow_dispatch:

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main gets a group of its own through the run id, since a shared group would
# still let a newer pending run replace an older pending one even with
# cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which app a pull request touches, so an app-only change does not pay for
  # the API build and the arm64 image, and an API-only change does not pay for
  # the Expo web export. `Lint & Test` is not filtered: its boundary suites
  # read apps/app, the workflows and the manifests. Anything outside the two
  # app directories (bun.lock, any package.json, scripts, this workflow) counts
  # as both. Pushes to main always run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            api:
              - 'apps/api/**'
            app:
              - 'apps/app/**'
            manifests:
              - '**/package.json'
            shared:
              - '**'
              - '!apps/api/**'
              - '!apps/app/**'
              - '!docs/**'
              - '!**/*.md'

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nilo
          POSTGRES_PASSWORD: nilo
          POSTGRES_DB: postgres
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U nilo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bunx biome ci .

      # `packageManager` is the one bun pin. Every setup-bun here reads it, but
      # apps/api/Dockerfile's `FROM oven/bun:<ver>` is a literal; this fails
      # when the image (or a workflow) runs a different bun from the one that
      # wrote bun.lock.
      - name: Check the bun pin
        run: bun run check:bun-pin

      # Every `test*`/`check*` script in any package.json is run by this
      # workflow, and every test file outside the API's vitest tree is named by
      # one — `test:worker` once passed for months with no workflow running it.
      - name: Check every test and check script is run by CI
        run: bun run check:ci-wiring

      # The Cloudflare Worker that serves the web app (apps/app/worker, the
      # `main` of apps/app/wrangler.toml). Its tests are bun tests outside
      # either app's suite, so no other step runs them.
      - name: Run web worker tests
        run: bun run test:worker

      - name: Run API tests
        run: bun run --filter @nilo/api test

      # Production runs the API on Bun (apps/api/Dockerfile), so the same unit
      # suite also runs under Bun's runtime and test runner, not only under
      # vitest on Node. The *.pgdb suite stays on vitest: several of its files
      # rely on vitest-only APIs (vi.hoisted, `.rejects.toSatisfy`, thenables
      # under `.resolves`); the image smoke below covers Postgres under Bun.
      - name: Run API tests under Bun
        run: bun run --filter @nilo/api test:bun

      - name: Run API tests against PostgreSQL
        env:
          NILO_TEST_DATABASE_URL: postgres://nilo:nilo@127.0.0.1:5439/postgres
        run: bun run --filter @nilo/api test:pgdb

      # Builds the API and EXECUTES the built artefact under bun — the
      # image's runtime and command — with boot forced to fail, asserting a
      # non-zero exit, plus a real boot and clean shutdown as the control. An
      # uncaught exception at boot once exited 0, which reads as success.
      - name: The built API exits non-zero when boot fails
        env:
          NILO_TEST_DATABASE_URL: postgres://nilo:nilo@127.0.0.1:5439/postgres
        run: bun run check:api-entrypoints

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding
      # main undeployable. The fixture tests run first so a green check means
      # the gate can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Prove the base-image digest bump rewrites and re-pins
        run: python3 -B -m unittest discover -s .github/scripts -p test_bump_base_digests.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

      - name: Run app tests
        run: bun run --filter @nilo/app test

      - name: Run end-to-end editing tests against PostgreSQL
        env:
          NILO_TEST_DATABASE_URL: postgres://nilo:nilo@127.0.0.1:5439/postgres
        run: bun run test:e2e

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.api == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: bun run build:api

  build-production-image:
    name: Build Production Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.api == 'true'
    # A throwaway database for the image smoke below; nothing else uses it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nilo
          POSTGRES_PASSWORD: nilo
          POSTGRES_DB: nilo
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U nilo -d nilo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The same recipe the deploy builds, from the same guard: the Dockerfile
      # and context are its outputs, so this smoke tests what production would
      # build and fails like the deploy would on unreviewed inputs.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe nilo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Reads the deploy's cache scope on every run. Only a push to main writes
      # it (mode=max, every stage): deploy-aws.yml runs after this CI succeeds
      # on main and builds the same recipe from this cache, so the release is
      # cache hits rather than a second arm64 build. A pull request or a
      # dispatched run (the base-digest bump branch) never writes, so no
      # unmerged code can plant layers a production build would reuse.
      # Loaded into the runner's Docker, never pushed.
      - name: Build ARM64 API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.reviewed.outputs.context }}
          file: ${{ steps.reviewed.outputs.dockerfile }}
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: nilo-api:ci
          cache-from: type=gha,scope=nilo-api
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'type=gha,scope=nilo-api,mode=max' || '' }}

      # The image's own CMD, unmodified, with no DATABASE_URL: boot must fail
      # and the container must exit non-zero. The log line proves it got as far
      # as boot — a container that cannot even load the bundle also exits
      # non-zero. 124 is `timeout` killing a container that never exited.
      - name: The image exits non-zero when boot fails
        run: |
          set +e
          output=$(timeout 60 docker run --rm nilo-api:ci 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output" | tail -n 20
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "::error::the image exited $code with boot forced to fail; it must exit non-zero"
            exit 1
          fi
          if ! grep -qF 'DATABASE_URL is required.' <<<"$output"; then
            echo "::error::the image exited $code without reaching boot (no 'DATABASE_URL is required.')"
            exit 1
          fi
          echo "The image's CMD exited $code on a failed boot."

      # The image as ECS runs it: Bun as PID 1, both migrator phases, a 200
      # from /health/ready and a graceful exit 0 on SIGTERM. Also what the
      # image must hold: root-owned code the app user cannot write (only
      # /app/uploads is writable), no curl/wget, no API devDependencies, and a
      # HEALTHCHECK that passes on the live API and fails with none.
      - name: Smoke the API image under its Bun runtime
        env:
          IMAGE: nilo-api:ci
          DATABASE_URL: postgres://nilo:nilo@127.0.0.1:5439/nilo
        run: bash .github/scripts/smoke-api-image.sh

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.app == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.test
        run: bun run build:app
