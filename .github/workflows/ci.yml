name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which app a pull request touches, so an app-only change does not pay for
  # the API build and the arm64 image, and an API-only change does not pay for
  # the Expo web export. `Lint & Test` is not filtered: its boundary suites
  # read apps/app, the workflows and the manifests. Anything outside the two
  # app directories (bun.lock, any package.json, scripts, this workflow) counts
  # as both. Pushes to main always run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            api:
              - 'apps/api/**'
            app:
              - 'apps/app/**'
            manifests:
              - '**/package.json'
            shared:
              - '**'
              - '!apps/api/**'
              - '!apps/app/**'
              - '!docs/**'
              - '!**/*.md'

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nilo
          POSTGRES_PASSWORD: nilo
          POSTGRES_DB: postgres
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U nilo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint API
        run: bun run --filter @nilo/api lint

      - name: Run API tests
        run: bun run --filter @nilo/api test

      - name: Run API tests against PostgreSQL
        env:
          NILO_TEST_DATABASE_URL: postgres://nilo:nilo@127.0.0.1:5439/postgres
        run: bun run --filter @nilo/api test:pgdb

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.api == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: bun run build:api

  build-production-image:
    name: Build Production Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.api == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 API image
        run: docker build -f apps/api/Dockerfile -t nilo-api:ci .

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.app == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.test
        run: bun run build:app
